name: FabOS Web Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run storefront regression tests
        run: npm test

      - name: Validate Pages API configuration
        shell: bash
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::VITE_API_URL repository variable is required for the GitHub Pages deployment."
            echo "Set it to the public FabOS API base, for example https://api.example.com/api"
            exit 1
          fi
          case "${VITE_API_URL}" in
            http://localhost*|http://127.0.0.1*|https://localhost*|https://127.0.0.1*)
              echo "::error::VITE_API_URL must not point to localhost or 127.0.0.1 for GitHub Pages."
              exit 1
              ;;
          esac
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build storefront
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
