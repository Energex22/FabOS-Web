name: FabOS Web Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run storefront regression tests
        run: npm test
      - name: Build storefront
        run: npm run build

      - name: Upload production storefront
        uses: actions/upload-artifact@v4
        with:
          name: FabVex-Web-production
          path: dist/
          if-no-files-found: error
          retention-days: 14
